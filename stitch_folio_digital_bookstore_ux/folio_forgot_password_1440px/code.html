<body class="bg-surface text-on-surface font-body antialiased">
  <div class="min-h-[1024px] flex flex-col" data-stitch-vh="min-h-[1024px]===min-h-screen">
    <header class="bg-surface border-b border-outline">
      <div class="max-w-[1320px] mx-auto px-page-margin-desktop h-20 flex items-center justify-between">
        <a href="../auth-login-desktop/LoginDesktop.html" class="font-label text-label-md text-on-surface-muted hover:text-on-surface inline-flex items-center gap-1.5">
          <span class="material-symbols-outlined text-[18px]">arrow_back</span>
          <span>Back to Sign In</span>
        </a>
        <a href="../home-desktop/FolioHomepageDesktop.html" aria-label="FOLIO Home">
          <svg width="94" height="32" viewBox="0 0 94 32" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
            <path d="M12 25C13.5 16 15.8 8.5 18.5 5.5C20.2 3.6 24.5 3.8 26.5 4.8M11 15.5C15.2 14.8 19.2 14.5 22.8 14.8" stroke="#171717" stroke-width="1.65" stroke-linecap="round"></path>
            <text x="30" y="23" font-family="&#39;Cormorant Garamond&#39;, Georgia, serif" font-style="italic" font-size="23" font-weight="600" letter-spacing="1.8" fill="#171717">folio</text>
          </svg>
        </a>
        <div class="w-24"></div>
      </div>
    </header>

    <main class="flex-1 flex items-center justify-center px-page-margin py-section-md">
      <div class="max-w-md w-full bg-surface-white border border-outline rounded p-10 flex flex-col gap-gutter-lg">
        <header class="flex flex-col gap-1">
          <h1 class="font-headline text-headline-lg text-on-surface">Reset your password</h1>
          <p class="font-body text-body-md text-on-surface-muted">
            Enter the email address associated with your FOLIO account and we will send you a secure reset link.
          </p>
        </header>

        <form id="forgot-form" class="flex flex-col gap-gutter-md" novalidate>
          <label class="flex flex-col gap-1.5">
            <span class="font-label text-label-md text-on-surface">Email address</span>
            <input id="forgot-email" type="email" required placeholder="reader@domain.com" class="w-full px-gutter-md py-3 bg-surface-white border border-outline rounded text-body-md focus:border-primary focus:ring-1 focus:ring-primary">
          </label>
          <button type="submit" class="w-full py-3.5 bg-primary text-on-primary rounded font-label text-label-lg hover:bg-on-surface">Send Reset Instructions</button>
        </form>

        <div id="forgot-confirm" class="hidden p-gutter-md bg-surface-secondary border border-outline rounded flex flex-col gap-2">
          <span class="font-label text-label-md text-success">Instructions Sent</span>
          <p class="font-body text-body-sm text-on-surface-muted">If an account matches that address, a reset link is on its way. The link expires in 30 minutes.</p>
          <a href="../auth-reset-password-desktop/ResetPasswordDesktop.html" class="font-label text-label-md text-on-surface underline underline-offset-4 pt-1">Continue to Reset Password</a>
        </div>
      </div>
    </main>
  </div>

  <script>
    document.getElementById('forgot-form').addEventListener('submit', (e) => {
      e.preventDefault();
      if (document.getElementById('forgot-email').value.includes('@')) {
        document.getElementById('forgot-confirm').classList.remove('hidden');
      }
    });
  </script>


</body></html>
