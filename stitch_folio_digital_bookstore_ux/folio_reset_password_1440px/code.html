  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400&amp;family=Inter:wght@400;500;600&amp;display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=block" rel="stylesheet">
  <style>.material-symbols-outlined { display: inline-block; width: 1em; height: 1em; line-height: 1 !important; box-sizing: content-box; overflow: hidden; white-space: nowrap; direction: ltr; vertical-align: middle; }</style>
</head>
<body class="bg-surface text-on-surface font-body antialiased">
  <div class="min-h-[1024px] flex flex-col" data-stitch-vh="min-h-[1024px]===min-h-screen">
    <header class="bg-surface border-b border-outline">
      <div class="max-w-[1320px] mx-auto px-page-margin-desktop h-20 flex items-center justify-center">
        <a href="../home-desktop/FolioHomepageDesktop.html" aria-label="FOLIO Home">
          <svg width="94" height="32" viewBox="0 0 94 32" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
            <path d="M12 25C13.5 16 15.8 8.5 18.5 5.5C20.2 3.6 24.5 3.8 26.5 4.8M11 15.5C15.2 14.8 19.2 14.5 22.8 14.8" stroke="#171717" stroke-width="1.65" stroke-linecap="round"></path>
            <text x="30" y="23" font-family="&#39;Cormorant Garamond&#39;, Georgia, serif" font-style="italic" font-size="23" font-weight="600" letter-spacing="1.8" fill="#171717">folio</text>
          </svg>
        </a>
      </div>
    </header>

    <main class="flex-1 flex items-center justify-center px-page-margin py-section-md">
      <div class="max-w-md w-full bg-surface-white border border-outline rounded p-10 flex flex-col gap-gutter-lg">
        <header class="flex flex-col gap-1">
          <h1 class="font-headline text-headline-lg text-on-surface">Create a new password</h1>
          <p class="font-body text-body-sm text-on-surface-muted">Choose a strong password of at least 8 characters.</p>
        </header>

        <form id="reset-form" class="flex flex-col gap-gutter-md" novalidate>
          <label class="flex flex-col gap-1.5">
            <span class="font-label text-label-md text-on-surface">New password</span>
            <div class="relative flex items-center">
              <input id="rp-pw1" type="password" required placeholder="Enter new password" class="w-full pl-3.5 pr-11 py-3 bg-surface-white border border-outline rounded text-body-md focus:border-primary focus:ring-1 focus:ring-primary">
              <button type="button" data-t="rp-pw1" aria-label="Show password" class="rp-eye absolute right-3 w-8 h-8 flex items-center justify-center text-on-surface-muted"><span class="material-symbols-outlined text-[18px]">visibility</span></button>
            </div>
            <!-- Password Strength Bar -->
            <div class="flex items-center gap-2 pt-1">
              <div class="flex-1 h-1.5 bg-surface-hero rounded overflow-hidden"><div id="rp-bar" class="h-full w-1/4 bg-outline transition-all"></div></div>
              <span id="rp-strength-label" class="font-label text-label-sm text-on-surface-muted">Strength</span>
            </div>
          </label>

          <label class="flex flex-col gap-1.5">
            <span class="font-label text-label-md text-on-surface">Confirm new password</span>
            <div class="relative flex items-center">
              <input id="rp-pw2" type="password" required placeholder="Repeat new password" class="w-full pl-3.5 pr-11 py-3 bg-surface-white border border-outline rounded text-body-md focus:border-primary focus:ring-1 focus:ring-primary">
              <button type="button" data-t="rp-pw2" aria-label="Show confirm password" class="rp-eye absolute right-3 w-8 h-8 flex items-center justify-center text-on-surface-muted"><span class="material-symbols-outlined text-[18px]">visibility</span></button>
            </div>
          </label>

          <p id="rp-error" class="hidden font-body text-body-sm text-error" role="alert"></p>
          <button type="submit" class="w-full py-3.5 bg-primary text-on-primary rounded font-label text-label-lg hover:bg-on-surface">Update Password</button>
        </form>

        <div id="rp-success" class="hidden p-gutter-md bg-surface-secondary border border-outline rounded flex flex-col gap-2 text-center">
          <span class="font-label text-label-md text-success">Password Updated</span>
          <p class="font-body text-body-sm text-on-surface-muted">Your password has been changed. You can now sign in.</p>
          <a href="../auth-login-desktop/LoginDesktop.html" class="mt-1 py-2.5 bg-primary text-on-primary rounded font-label text-label-md">Go to Sign In</a>
        </div>
      </div>
    </main>
  </div>

  <script>
    (function () {
      document.querySelectorAll('.rp-eye').forEach(b => b.addEventListener('click', () => {
        const inp = document.getElementById(b.dataset.t);
        const s = inp.type === 'password';
        inp.type = s ? 'text' : 'password';
        b.querySelector('.material-symbols-outlined').textContent = s ? 'visibility_off' : 'visibility';
      }));
      const pw1 = document.getElementById('rp-pw1');
      const bar = document.getElementById('rp-bar');
      const lbl = document.getElementById('rp-strength-label');
      pw1.addEventListener('input', () => {
        const v = pw1.value;
        let score = 0;
        if (v.length >= 8) score++;
        if (/[A-Z]/.test(v) && /[0-9]/.test(v)) score++;
        if (/[^A-Za-z0-9]/.test(v)) score++;
        bar.className = 'h-full transition-all ' + (score === 3 ? 'w-full bg-success' : score === 2 ? 'w-2/3 bg-primary' : 'w-1/3 bg-error');
        lbl.textContent = score === 3 ? 'Strong' : score === 2 ? 'Good' : 'Weak';
      });
      document.getElementById('reset-form').addEventListener('submit', (e) => {
        e.preventDefault();
        const err = document.getElementById('rp-error');
        if (pw1.value.length < 8 || pw1.value !== document.getElementById('rp-pw2').value) {
          err.textContent = 'Passwords must match and be at least 8 characters.';
          err.classList.remove('hidden');
          return;
        }
        err.classList.add('hidden');
        document.getElementById('reset-form').classList.add('hidden');
        document.getElementById('rp-success').classList.remove('hidden');
      });
    })();
  </script>


</body></html>
