<body class="bg-surface text-on-surface font-body antialiased">
  <div class="min-h-[1024px] flex flex-col" data-stitch-vh="min-h-[1024px]===min-h-screen">
    <header class="sticky top-0 z-40 bg-surface border-b border-outline">
      <div class="max-w-[1320px] mx-auto px-page-margin-desktop h-20 grid grid-cols-3 items-center">
        <a href="../account-dashboard/AccountDashboard.html" class="font-label text-label-md text-on-surface-muted hover:text-on-surface inline-flex items-center gap-1.5">
          <span class="material-symbols-outlined text-[18px]">arrow_back</span><span>Dashboard</span>
        </a>
        <div class="flex justify-center">
          <a href="../home-desktop/FolioHomepageDesktop.html" aria-label="FOLIO Home">
            <svg width="94" height="32" viewBox="0 0 94 32" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
              <path d="M12 25C13.5 16 15.8 8.5 18.5 5.5C20.2 3.6 24.5 3.8 26.5 4.8M11 15.5C15.2 14.8 19.2 14.5 22.8 14.8" stroke="#171717" stroke-width="1.65" stroke-linecap="round"></path>
              <text x="30" y="23" font-family="&#39;Cormorant Garamond&#39;, Georgia, serif" font-style="italic" font-size="23" font-weight="600" letter-spacing="1.8" fill="#171717">folio</text>
            </svg>
          </a>
        </div>
        <div class="flex justify-end"><span class="px-3 py-1 bg-surface-hero border border-outline rounded-full font-label text-label-sm">Ananya S.</span></div>
      </div>
    </header>

    <div class="max-w-[1320px] w-full mx-auto px-page-margin-desktop py-section-sm grid grid-cols-1 md:grid-cols-12 gap-gutter-xl flex-1">
      <aside class="md:col-span-3 flex flex-col gap-gutter-sm border-r border-outline pr-gutter-lg">
        <span class="font-label text-label-sm uppercase tracking-widest text-on-surface-muted px-3 mb-1">Reader Account</span>
        <a href="../account-dashboard/AccountDashboard.html" class="px-3 py-2.5 rounded font-label text-label-lg text-on-surface-muted hover:text-on-surface hover:bg-surface-secondary flex items-center gap-3"><span class="material-symbols-outlined text-[18px]">home</span><span>Dashboard</span></a>
        <a href="../account-library/MyLibrary.html" class="px-3 py-2.5 rounded bg-surface-hero font-label text-label-lg text-on-surface flex items-center gap-3"><span class="material-symbols-outlined text-[18px]">library_books</span><span>My Library</span></a>
        <a href="../account-reading-history/ReadingHistory.html" class="px-3 py-2.5 rounded font-label text-label-lg text-on-surface-muted hover:text-on-surface hover:bg-surface-secondary flex items-center gap-3"><span class="material-symbols-outlined text-[18px]">history</span><span>Reading History</span></a>
        <a href="../account-downloads/AccountDownloads.html" class="px-3 py-2.5 rounded font-label text-label-lg text-on-surface-muted hover:text-on-surface hover:bg-surface-secondary flex items-center gap-3"><span class="material-symbols-outlined text-[18px]">download</span><span>Downloads</span></a>
        <a href="../account-bookmarks/BookmarksNotes.html" class="px-3 py-2.5 rounded font-label text-label-lg text-on-surface-muted hover:text-on-surface hover:bg-surface-secondary flex items-center gap-3"><span class="material-symbols-outlined text-[18px]">bookmark</span><span>Bookmarks &amp; Notes</span></a>
      </aside>

      <main class="md:col-span-9 flex flex-col gap-gutter-lg">
        <div class="flex flex-col md:flex-row md:items-end justify-between gap-gutter-md border-b border-outline pb-gutter-lg">
          <div>
            <h1 class="font-headline text-display-lg text-on-surface">My Library</h1>
            <p class="font-body text-body-md text-on-surface-muted">All purchased digital editions in one quiet shelf.</p>
          </div>
          <div class="w-full md:w-72 relative flex items-center">
            <span class="material-symbols-outlined text-[18px] text-on-surface-muted absolute left-3">search</span>
            <input id="lib-search" type="search" placeholder="Search library..." class="w-full pl-9 pr-3 py-2 bg-surface-white border border-outline rounded text-body-sm">
          </div>
        </div>

        <!-- Status & Category Filters + Sort -->
        <div class="flex flex-wrap items-center justify-between gap-gutter-md">
          <div class="flex flex-wrap items-center gap-2">
            <button type="button" data-status="all" class="lib-tab px-3.5 py-1.5 rounded-full bg-primary text-on-primary font-label text-label-md">All (3)</button>
            <button type="button" data-status="unread" class="lib-tab px-3.5 py-1.5 rounded-full bg-surface-white border border-outline font-label text-label-md">Unread</button>
            <button type="button" data-status="reading" class="lib-tab px-3.5 py-1.5 rounded-full bg-surface-white border border-outline font-label text-label-md">In Progress</button>
            <button type="button" data-status="finished" class="lib-tab px-3.5 py-1.5 rounded-full bg-surface-white border border-outline font-label text-label-md">Finished</button>
          </div>
          <div class="flex items-center gap-2">
            <select id="lib-cat" class="py-1.5 pl-3 pr-8 bg-surface-white border border-outline rounded text-body-sm">
              <option value="all">All Categories</option>
              <option value="Philosophy">Philosophy</option>
              <option value="Creativity">Creativity</option>
            </select>
            <select id="lib-sort" class="py-1.5 pl-3 pr-8 bg-surface-white border border-outline rounded text-body-sm">
              <option value="date">Sort: Purchase Date</option>
              <option value="title">Sort: Title</option>
              <option value="progress">Sort: Progress</option>
            </select>
          </div>
        </div>

        <div id="lib-grid" class="grid grid-cols-1 md:grid-cols-3 gap-gutter-lg"></div>
      </main>
    </div>
  </div>

  <script>
    (function () {
      const books = [
        { title: 'The Art of Slow Thinking', author: 'Clara Vance', cat: 'Philosophy', progress: 23, status: 'reading', date: 202611, dl: true, img: '../../images/book_thinking.jpg' },
        { title: 'On Attention & Deep Craft', author: 'Julian Mercer', cat: 'Creativity', progress: 0, status: 'unread', date: 202611, dl: false, img: '../../images/book_month.jpg' },
        { title: 'Form, Space & Silence', author: 'Naomi Takahashi', cat: 'Creativity', progress: 100, status: 'finished', date: 202609, dl: true, img: '../../images/book_craft.jpg' }
      ];
      let statusFilter = 'all';
      const grid = document.getElementById('lib-grid');

      function render() {
        const q = document.getElementById('lib-search').value.trim().toLowerCase();
        const cat = document.getElementById('lib-cat').value;
        const sort = document.getElementById('lib-sort').value;
        let items = books.filter(b =>
          (!q || b.title.toLowerCase().includes(q) || b.author.toLowerCase().includes(q)) &&
          (statusFilter === 'all' || b.status === statusFilter) &&
          (cat === 'all' || b.cat === cat)
        );
        if (sort === 'title') items.sort((a, b) => a.title.localeCompare(b.title));
        else if (sort === 'progress') items.sort((a, b) => b.progress - a.progress);
        else items.sort((a, b) => b.date - a.date);

        if (items.length === 0) {
          grid.className = 'block';
          grid.innerHTML = '<div class="py-16 text-center bg-surface-secondary border border-outline rounded"><p class="font-headline text-title-lg">No matching books in your library</p><p class="font-body text-body-sm text-on-surface-muted mt-1">Adjust your search or status filter.</p></div>';
          return;
        }
        grid.className = 'grid grid-cols-1 md:grid-cols-3 gap-gutter-lg';
        grid.innerHTML = items.map(b =>
          '<article class="bg-surface-white border border-outline rounded p-gutter-md flex flex-col justify-between gap-gutter-md">' +
            '<div class="flex flex-col gap-gutter-sm">' +
              '<div class="bg-surface-hero rounded-sm p-gutter-md flex items-center justify-center aspect-[4/5]"><img src="' + b.img + '" alt="' + b.title + '" class="w-2/3 aspect-[2/3] object-cover rounded-sm shadow" /></div>' +
              '<h2 class="font-title text-title-md text-on-surface">' + b.title + '</h2>' +
              '<p class="font-body text-body-sm text-on-surface-muted">' + b.author + '</p>' +
              '<div class="w-full h-1.5 bg-surface-hero rounded overflow-hidden"><div class="h-full bg-primary" style="width:' + b.progress + '%"></div></div>' +
              '<span class="font-body text-body-sm text-on-surface-muted tabular-nums">' + b.progress + '% read</span>' +
            '</div>' +
            '<div class="flex flex-col gap-2 pt-2 border-t border-outline">' +
              '<a href="../ebook-reader-desktop/EbookReaderDesktop.html" class="w-full py-2 bg-primary text-on-primary rounded font-label text-label-md text-center">Read Now</a>' +
              (b.dl ? '<a href="../account-downloads/AccountDownloads.html" class="w-full py-2 border border-outline rounded font-label text-label-md text-center hover:border-primary">Download EPUB</a>' : '<span class="w-full py-2 text-center font-label text-label-sm text-on-surface-muted">Web Reader Only (Downloads disabled)</span>') +
            '</div>' +
          '</article>'
        ).join('');
      }

      document.querySelectorAll('.lib-tab').forEach(btn => btn.addEventListener('click', () => {
        statusFilter = btn.dataset.status;
        document.querySelectorAll('.lib-tab').forEach(b => {
          b.className = b === btn ? 'lib-tab px-3.5 py-1.5 rounded-full bg-primary text-on-primary font-label text-label-md' : 'lib-tab px-3.5 py-1.5 rounded-full bg-surface-white border border-outline font-label text-label-md';
        });
        render();
      }));
      document.getElementById('lib-search').addEventListener('input', render);
      document.getElementById('lib-cat').addEventListener('change', render);
      document.getElementById('lib-sort').addEventListener('change', render);
      render();
    })();
  </script>
