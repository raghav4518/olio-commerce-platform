  <script>
    (function () {
      const dlg = document.getElementById('m-filter-drawer');
      document.getElementById('m-open-filters').addEventListener('click', () => dlg.showModal());
      document.getElementById('m-close-filters').addEventListener('click', () => dlg.close());
      document.getElementById('m-apply-filters').addEventListener('click', () => dlg.close());
      document.querySelectorAll('.m-wish-btn').forEach(btn => btn.addEventListener('click', () => {
        const ic = btn.querySelector('.material-symbols-outlined');
        ic.textContent = ic.textContent === 'bookmark' ? 'bookmark_border' : 'bookmark';
      }));
    })();
  </script>
