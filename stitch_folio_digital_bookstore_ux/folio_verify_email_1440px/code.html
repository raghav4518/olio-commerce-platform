<body class="bg-surface text-on-surface font-body antialiased">
  <div class="min-h-[1024px] flex flex-col" data-stitch-vh="min-h-[1024px]===min-h-screen">
    <header class="bg-surface border-b border-outline">
      <div class="max-w-[1320px] mx-auto px-page-margin-desktop h-20 flex items-center justify-between">
        <a href="../home-desktop/FolioHomepageDesktop.html" class="font-label text-label-md text-on-surface-muted hover:text-on-surface inline-flex items-center gap-1.5">
          <span class="material-symbols-outlined text-[18px]">arrow_back</span>
          <span>Return to bookstore</span>
        </a>
        <a href="../home-desktop/FolioHomepageDesktop.html" aria-label="FOLIO Home">
          <svg width="94" height="32" viewBox="0 0 94 32" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
            <path d="M12 25C13.5 16 15.8 8.5 18.5 5.5C20.2 3.6 24.5 3.8 26.5 4.8M11 15.5C15.2 14.8 19.2 14.5 22.8 14.8" stroke="#171717" stroke-width="1.65" stroke-linecap="round"></path>
            <text x="30" y="23" font-family="&#39;Cormorant Garamond&#39;, Georgia, serif" font-style="italic" font-size="23" font-weight="600" letter-spacing="1.8" fill="#171717">folio</text>
          </svg>
        </a>
        <div class="w-28"></div>
      </div>
    </header>

    <main class="flex-1 flex items-center justify-center px-page-margin py-section-md">
      <div class="max-w-md w-full bg-surface-white border border-outline rounded p-10 text-center flex flex-col items-center gap-gutter-md">
        <div class="w-14 h-14 rounded-full bg-surface-hero border border-outline flex items-center justify-center text-on-surface">
          <span class="material-symbols-outlined text-[28px]" aria-hidden="true">mark_email_read</span>
        </div>
        <h1 class="font-headline text-headline-lg text-on-surface">Check your inbox</h1>
        <p class="font-body text-body-md text-on-surface-muted text-pretty">
          We sent a verification link to <span id="verify-target-email" class="text-on-surface font-medium">ananya.sharma@example.in</span>. Click the link inside to activate your FOLIO account.
        </p>

        <p id="resend-status" class="hidden font-body text-body-sm text-success" role="status"></p>

        <div class="w-full flex flex-col gap-gutter-sm pt-2">
          <button id="btn-resend-verify" type="button" class="w-full py-3.5 bg-primary text-on-primary rounded font-label text-label-lg hover:bg-on-surface">Resend Verification Email</button>
          <button id="btn-change-email" type="button" class="w-full py-3 bg-surface-white border border-outline rounded font-label text-label-lg text-on-surface hover:border-primary">Change Email Address</button>
        </div>

        <form id="change-email-form" class="hidden w-full pt-gutter-sm border-t border-outline flex gap-2">
          <input id="new-verify-email" type="email" placeholder="new@domain.com" required class="flex-1 px-3 py-2 bg-surface-white border border-outline rounded text-body-sm">
          <button type="submit" class="px-4 py-2 bg-primary text-on-primary rounded font-label text-label-md">Update</button>
        </form>

        <a href="../auth-login-desktop/LoginDesktop.html" class="font-label text-label-md text-on-surface-muted underline underline-offset-4 hover:text-on-surface pt-2">Back to Sign In</a>
      </div>
    </main>
  </div>

  <script>
    (function () {
      const status = document.getElementById('resend-status');
      document.getElementById('btn-resend-verify').addEventListener('click', () => {
        status.textContent = 'A fresh verification link has been sent.';
        status.classList.remove('hidden');
      });
      const chForm = document.getElementById('change-email-form');
      document.getElementById('btn-change-email').addEventListener('click', () => chForm.classList.toggle('hidden'));
      chForm.addEventListener('submit', (e) => {
        e.preventDefault();
        const val = document.getElementById('new-verify-email').value.trim();
        if (val) {
          document.getElementById('verify-target-email').textContent = val;
          chForm.classList.add('hidden');
          status.textContent = 'Verification sent to ' + val + '.';
          status.classList.remove('hidden');
        }
      });
    })();
  </script>


</body></html>
