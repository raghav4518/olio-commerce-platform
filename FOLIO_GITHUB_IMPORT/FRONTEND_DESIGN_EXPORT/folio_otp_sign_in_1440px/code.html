  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400&amp;family=Inter:wght@400;500;600&amp;display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=block" rel="stylesheet">
  <style>.material-symbols-outlined { display: inline-block; width: 1em; height: 1em; line-height: 1 !important; box-sizing: content-box; overflow: hidden; white-space: nowrap; direction: ltr; vertical-align: middle; }</style>
</head>
<body class="bg-surface text-on-surface font-body antialiased">
  <div class="min-h-[1024px] flex flex-col" data-stitch-vh="min-h-[1024px]===min-h-screen">
    <header class="bg-surface border-b border-outline">
      <div class="max-w-[1320px] mx-auto px-page-margin-desktop h-20 flex items-center justify-between">
        <a href="../auth-login-desktop/LoginDesktop.html" class="font-label text-label-md text-on-surface-muted hover:text-on-surface inline-flex items-center gap-1.5">
          <span class="material-symbols-outlined text-[18px]">arrow_back</span>
          <span>Password Sign In</span>
        </a>
        <a href="../home-desktop/FolioHomepageDesktop.html" aria-label="FOLIO Home">
          <svg width="94" height="32" viewBox="0 0 94 32" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
            <path d="M12 25C13.5 16 15.8 8.5 18.5 5.5C20.2 3.6 24.5 3.8 26.5 4.8M11 15.5C15.2 14.8 19.2 14.5 22.8 14.8" stroke="#171717" stroke-width="1.65" stroke-linecap="round"></path>
            <text x="30" y="23" font-family="&#39;Cormorant Garamond&#39;, Georgia, serif" font-style="italic" font-size="23" font-weight="600" letter-spacing="1.8" fill="#171717">folio</text>
          </svg>
        </a>
        <div class="w-28"></div>
      </div>
    </header>

    <main class="flex-1 flex items-center justify-center px-page-margin py-section-md">
      <div class="max-w-md w-full bg-surface-white border border-outline rounded p-10 flex flex-col gap-gutter-lg">
        <header class="flex flex-col gap-1">
          <span class="font-label text-label-sm uppercase tracking-widest text-on-surface-muted">Optional · Configurable OTP</span>
          <h1 class="font-headline text-headline-lg text-on-surface">Sign in with a one-time code</h1>
          <p class="font-body text-body-sm text-on-surface-muted">Receive a 6-digit verification code via phone or email.</p>
        </header>

        <!-- Channel Toggle -->
        <div class="grid grid-cols-2 gap-1 p-1 bg-surface-secondary border border-outline rounded">
          <button id="otp-tab-phone" type="button" class="py-2 rounded-sm bg-surface-white font-label text-label-md text-on-surface shadow-sm">Phone (SMS)</button>
          <button id="otp-tab-email" type="button" class="py-2 rounded-sm font-label text-label-md text-on-surface-muted">Email</button>
        </div>

        <form id="otp-request-form" class="flex flex-col gap-gutter-md">
          <label class="flex flex-col gap-1.5">
            <span id="otp-channel-label" class="font-label text-label-md text-on-surface">Mobile number</span>
            <input id="otp-target" type="tel" placeholder="+91 98765 43210" required class="w-full px-gutter-md py-3 bg-surface-white border border-outline rounded text-body-md focus:border-primary focus:ring-1 focus:ring-primary">
          </label>
          <button type="submit" class="w-full py-3.5 bg-primary text-on-primary rounded font-label text-label-lg hover:bg-on-surface">Send One-Time Code</button>
        </form>

        <form id="otp-verify-form" class="hidden flex flex-col gap-gutter-md pt-gutter-md border-t border-outline">
          <label class="flex flex-col gap-1.5">
            <span class="font-label text-label-md text-on-surface">Enter 6-digit code</span>
            <input id="otp-code" type="text" maxlength="6" inputmode="numeric" placeholder="000000" class="w-full px-gutter-md py-3 bg-surface-white border border-outline rounded text-center tracking-widest text-title-md tabular-nums focus:border-primary focus:ring-1 focus:ring-primary">
          </label>
          <p id="otp-feedback" class="hidden font-body text-body-sm"></p>
          <button type="submit" class="w-full py-3.5 bg-primary text-on-primary rounded font-label text-label-lg hover:bg-on-surface">Verify &amp; Sign In</button>
        </form>
      </div>
    </main>
  </div>

  <script>
    (function () {
      const pTab = document.getElementById('otp-tab-phone');
      const eTab = document.getElementById('otp-tab-email');
      const lbl = document.getElementById('otp-channel-label');
      const inp = document.getElementById('otp-target');
      pTab.addEventListener('click', () => {
        pTab.className = 'py-2 rounded-sm bg-surface-white font-label text-label-md text-on-surface shadow-sm';
        eTab.className = 'py-2 rounded-sm font-label text-label-md text-on-surface-muted';
        lbl.textContent = 'Mobile number'; inp.type = 'tel'; inp.placeholder = '+91 98765 43210';
      });
      eTab.addEventListener('click', () => {
        eTab.className = 'py-2 rounded-sm bg-surface-white font-label text-label-md text-on-surface shadow-sm';
        pTab.className = 'py-2 rounded-sm font-label text-label-md text-on-surface-muted';
        lbl.textContent = 'Email address'; inp.type = 'email'; inp.placeholder = 'reader@domain.com';
      });
      document.getElementById('otp-request-form').addEventListener('submit', (e) => {
        e.preventDefault();
        document.getElementById('otp-verify-form').classList.remove('hidden');
      });
      document.getElementById('otp-verify-form').addEventListener('submit', (e) => {
        e.preventDefault();
        const fb = document.getElementById('otp-feedback');
        fb.classList.remove('hidden', 'text-error', 'text-success');
        if (document.getElementById('otp-code').value.trim().length < 6) {
          fb.textContent = 'Please enter the 6-digit verification code.';
          fb.classList.add('text-error');
          return;
        }
        fb.textContent = 'Verified. Signing you in...';
        fb.classList.add('text-success');
      });
    })();
  </script>


</body></html>
