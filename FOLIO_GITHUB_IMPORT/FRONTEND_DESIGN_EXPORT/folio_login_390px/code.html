<body class="bg-surface text-on-surface font-body antialiased">
  <div class="min-h-[884px] flex flex-col max-w-[390px] mx-auto" data-stitch-vh="min-h-[884px]===min-h-screen">
    <header class="px-page-margin h-16 flex items-center justify-between border-b border-outline bg-surface">
      <a href="../home-mobile/FolioHomepageMobile.html" class="inline-flex items-center gap-1 font-label text-label-md text-on-surface-muted">
        <span class="material-symbols-outlined text-[18px]">arrow_back</span>
        <span>Store</span>
      </a>
      <a href="../home-mobile/FolioHomepageMobile.html" aria-label="FOLIO Home">
        <svg width="82" height="28" viewBox="0 0 94 32" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
          <path d="M12 25C13.5 16 15.8 8.5 18.5 5.5C20.2 3.6 24.5 3.8 26.5 4.8M11 15.5C15.2 14.8 19.2 14.5 22.8 14.8" stroke="#171717" stroke-width="1.65" stroke-linecap="round"></path>
          <text x="30" y="23" font-family="&#39;Cormorant Garamond&#39;, Georgia, serif" font-style="italic" font-size="23" font-weight="600" letter-spacing="1.8" fill="#171717">folio</text>
        </svg>
      </a>
      <div class="w-12"></div>
    </header>

    <main class="flex-1 px-page-margin py-8 flex flex-col gap-gutter-lg">
      <div class="bg-surface-hero border border-outline rounded p-4 flex items-center gap-4">
        <img src="https://lh3.googleusercontent.com/aida/ALJJyrARaJCYbxEXxC_vQxuTmZGvq0E0qk8WolidDk86uSF2mODbjtaWQkP58RVUtQ_vbCIyeTN6c1rXTR5PLV0lGRLFbQV4j0_cVbKMhan8zzwxLMtiesN3nfa0F8Nj89DM7CK3-cNGi3hFoH_EtmEK0UCZcInhLl7MFx1hXgbstQCapTf9mKKUk-1uQKGfwiuRqvEwLQkkBQgJqO0V-yTiepvz0OoYmqtDqSmDLh7ec6rhY21CdswSCaYJBCU" alt class="w-12 aspect-[2/3] object-cover rounded-sm shadow">
        <p class="font-body text-body-sm text-on-surface-muted">Sign in to access your digital library across devices.</p>
      </div>

      <div class="flex flex-col gap-1">
        <h1 class="font-headline text-headline-lg-mobile text-on-surface" data-design-text-token="headline-lg-mobile">Sign in to FOLIO</h1>
        <p class="font-body text-body-sm text-on-surface-muted">Welcome back, reader.</p>
      </div>

      <form class="flex flex-col gap-gutter-md">
        <label class="flex flex-col gap-1.5">
          <span class="font-label text-label-md">Email address</span>
          <input type="email" placeholder="reader@domain.com" required class="w-full px-3.5 py-3 bg-surface-white border border-outline rounded text-body-md">
        </label>
        <label class="flex flex-col gap-1.5">
          <span class="font-label text-label-md">Password</span>
          <div class="relative flex items-center">
            <input id="m-login-pw" type="password" placeholder="Enter password" required class="w-full pl-3.5 pr-11 py-3 bg-surface-white border border-outline rounded text-body-md">
            <button id="m-toggle-pw" type="button" aria-label="Show password" class="absolute right-3 w-9 h-9 flex items-center justify-center text-on-surface-muted"><span class="material-symbols-outlined text-[18px]">visibility</span></button>
          </div>
        </label>
        <div class="flex items-center justify-between">
          <label class="flex items-center gap-2 font-body text-body-sm"><input type="checkbox" class="rounded-sm border-outline"> Remember me</label>
          <a href="../auth-forgot-password-desktop/ForgotPasswordDesktop.html" class="font-label text-label-md underline">Forgot password?</a>
        </div>
        <button type="submit" class="w-full py-3.5 bg-primary text-on-primary rounded font-label text-label-lg">Sign In</button>
      </form>

      <div class="pt-4 border-t border-outline text-center flex flex-col gap-2">
        <a href="../auth-otp-desktop/OtpSignInDesktop.html" class="font-label text-label-md underline">Sign in with OTP</a>
        <p class="font-body text-body-sm text-on-surface-muted">New to FOLIO? <a href="../auth-register-mobile/RegisterMobile.html" class="text-on-surface font-medium underline">Create account</a></p>
      </div>
    </main>
  </div>
  <script>
    document.getElementById('m-toggle-pw').addEventListener('click', (e) => {
      const inp = document.getElementById('m-login-pw');
      const s = inp.type === 'password';
      inp.type = s ? 'text' : 'password';
      e.currentTarget.querySelector('.material-symbols-outlined').textContent = s ? 'visibility_off' : 'visibility';
    });
  </script>
