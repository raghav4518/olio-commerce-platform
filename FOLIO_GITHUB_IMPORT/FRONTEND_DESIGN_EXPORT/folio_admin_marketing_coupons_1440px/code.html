<body class="bg-surface text-on-surface font-body antialiased">
  <div class="min-h-[1024px] flex bg-surface" data-stitch-vh="min-h-[1024px]===min-h-screen">
    <aside class="hidden lg:flex lg:w-64 shrink-0 flex-col justify-between border-r border-outline bg-surface-white min-h-[1024px]" data-stitch-vh="min-h-[1024px]===min-h-screen">
      <div class="flex flex-col gap-gutter-md p-gutter-md">
        <div class="flex items-center justify-between px-2 py-1 border-b border-outline pb-3"><a href="../admin-dashboard/AdminDashboard.html" class="flex items-center gap-2"><svg width="78" height="26" viewBox="0 0 94 32" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true"><path d="M12 25C13.5 16 15.8 8.5 18.5 5.5C20.2 3.6 24.5 3.8 26.5 4.8M11 15.5C15.2 14.8 19.2 14.5 22.8 14.8" stroke="#171717" stroke-width="1.65" stroke-linecap="round"></path><text x="30" y="23" font-family="&#39;Cormorant Garamond&#39;, Georgia, serif" font-style="italic" font-size="23" font-weight="600" letter-spacing="1.8" fill="#171717">folio</text></svg><span class="px-2 py-0.5 rounded bg-primary text-on-primary font-label text-label-sm">Admin</span></a></div>
        <nav class="flex flex-col gap-1">
          <a href="../admin-dashboard/AdminDashboard.html" class="px-3 py-2 rounded font-label text-label-md text-on-surface-muted flex items-center gap-2.5"><span class="material-symbols-outlined text-[18px]">dashboard</span><span>Overview</span></a>
          <a href="../admin-marketing/AdminMarketing.html" class="px-3 py-2 rounded bg-surface-hero font-label text-label-md text-on-surface flex items-center gap-2.5"><span class="material-symbols-outlined text-[18px]">sell</span><span>Marketing</span></a>
        </nav>
      </div>
      <div class="p-gutter-md border-t border-outline"><div><p class="font-label text-label-md">Vikram Mehta</p><p class="font-body text-body-sm text-on-surface-muted">Owner</p></div></div>
    </aside>

    <div class="flex-1 flex flex-col min-w-0">
      <header class="sticky top-0 z-30 bg-surface border-b border-outline px-page-margin md:px-gutter-xl h-16 flex items-center justify-between">
        <span class="font-title text-title-sm text-on-surface">Marketing &amp; Coupons</span>
        <button type="button" id="openCouponModal" class="px-gutter-md py-2 bg-primary text-on-primary rounded font-label text-label-sm">+ Create Coupon</button>
      </header>
      <main class="p-page-margin md:p-gutter-xl flex flex-col gap-gutter-xl max-w-[1360px] w-full mx-auto">
        <section class="border border-outline rounded bg-surface-white overflow-x-auto">
          <table class="w-full text-left border-collapse">
            <thead>
              <tr class="border-b border-outline bg-surface-secondary font-label text-label-sm text-on-surface-muted">
                <th class="p-3">Code</th><th class="p-3">Discount</th><th class="p-3">Min Order</th><th class="p-3">Usage</th><th class="p-3">Expiry</th><th class="p-3">Status</th>
              </tr>
            </thead>
            <tbody class="divide-y divide-outline font-body text-body-sm">
              <tr><td class="p-3 font-medium">QUIET10</td><td class="p-3 tabular-nums">₹100 flat</td><td class="p-3 tabular-nums">₹799.00</td><td class="p-3 tabular-nums">142 / 500</td><td class="p-3 tabular-nums">31 Dec 2026</td><td class="p-3"><span class="px-2 py-0.5 rounded-full bg-surface-hero border border-outline font-label text-label-sm text-success">Active</span></td></tr>
              <tr><td class="p-3 font-medium">AUTUMN15</td><td class="p-3 tabular-nums">15% (max ₹200)</td><td class="p-3 tabular-nums">₹499.00</td><td class="p-3 tabular-nums">88 / 200</td><td class="p-3 tabular-nums">30 Nov 2026</td><td class="p-3"><span class="px-2 py-0.5 rounded-full bg-surface-hero border border-outline font-label text-label-sm text-success">Active</span></td></tr>
            </tbody>
          </table>
        </section>
      </main>
    </div>
  </div>

  <dialog id="couponModal" class="m-auto w-full max-w-lg bg-surface-white border border-outline rounded p-gutter-lg backdrop:bg-on-surface/30">
    <h2 class="font-headline text-title-lg text-on-surface mb-gutter-md">Create Coupon</h2>
    <form class="flex flex-col gap-gutter-md">
      <div class="grid grid-cols-2 gap-gutter-md">
        <div><label class="block font-label text-label-sm mb-1">Coupon Code</label><input type="text" placeholder="WINTER20" class="w-full py-2 px-3 border border-outline rounded font-body text-body-sm"></div>
        <div><label class="block font-label text-label-sm mb-1">Discount Type</label><select class="w-full py-2 px-3 border border-outline rounded font-body text-body-sm"><option>Percentage (%)</option><option>Fixed Amount (₹)</option></select></div>
        <div><label class="block font-label text-label-sm mb-1">Value</label><input type="text" placeholder="20" class="w-full py-2 px-3 border border-outline rounded font-body text-body-sm"></div>
        <div><label class="block font-label text-label-sm mb-1">Min Order (₹)</label><input type="text" placeholder="499" class="w-full py-2 px-3 border border-outline rounded font-body text-body-sm"></div>
      </div>
      <div class="flex justify-end gap-2 pt-2">
        <button type="button" id="closeCouponModal" class="px-gutter-md py-2 border border-outline rounded font-label text-label-sm">Cancel</button>
        <button type="button" id="saveCouponBtn" class="px-gutter-md py-2 bg-primary text-on-primary rounded font-label text-label-sm">Save Coupon</button>
      </div>
    </form>
  </dialog>

  <script>
    (function () {
      const m = document.getElementById('couponModal');
      document.getElementById('openCouponModal').addEventListener('click', () => m.showModal());
      document.getElementById('closeCouponModal').addEventListener('click', () => m.close());
      document.getElementById('saveCouponBtn').addEventListener('click', () => m.close());
    })();
  </script>
